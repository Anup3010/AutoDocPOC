name: AutoDoc — Generate Documentation

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set AutoDoc mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "AUTODOC_MODE=both" >> $GITHUB_ENV
            echo "[AutoDoc] Push detected - generating both documents"
          else
            echo "AUTODOC_MODE=pr_only" >> $GITHUB_ENV
            echo "[AutoDoc] Pull request detected - generating PR analysis only"
          fi

      - name: Generate documentation
        run: python -m doc_generator.generator .
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          AUTODOC_MODE:        ${{ env.AUTODOC_MODE }}
          CONFLUENCE_URL:      ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_USER:     ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_TOKEN:    ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_PAGE_ID:  ${{ secrets.CONFLUENCE_PAGE_ID }}

      - name: Upload docs as artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: autodoc-${{ github.sha }}
          path: generated_docs/
          retention-days: 30

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AutoDoc — PR Analysis Generated
              
**Commit:** \`${{ github.sha }}\`
**Branch:** \`${{ github.head_ref }}\`
**Author:** ${{ github.actor }}

📄 Download the PR Impact Analysis from **Actions tab → Artifacts** section.

> Auto-generated by AutoDoc using Gemini AI`
            })